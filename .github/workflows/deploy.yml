name: Deploy portfolio site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            f1/package-lock.json

      - name: Install portfolio dependencies
        run: npm ci

      - name: Lint portfolio
        run: npm run lint

      - name: Build portfolio
        run: npm run build

      - name: Install F1 case-study dependencies
        working-directory: f1
        run: npm ci

      - name: Build F1 case study
        working-directory: f1
        env:
          VITE_BASE_PATH: /f1/
          VITE_SITE_URL: https://yundonggeurami.github.io/f1/
        run: npm run build

      - name: Verify F1 case study
        working-directory: f1
        run: npm run verify

      - name: Merge F1 case study into portfolio artifact
        shell: bash
        run: |
          mkdir -p dist/f1
          cp -R f1/dist/. dist/f1/
          test -f dist/index.html
          test -f dist/f1/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
